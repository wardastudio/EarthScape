{% extends 'layouts/base.html' %}
{% set hide_sidebar = True %}
{% set is_auth = True %}
{% set hide_footer = True %}

{% block title %}Reset Password | Earthscape Climate Agency{% endblock %}

{% block content %}
<div class="row justify-content-center w-100 mx-0">
    <div class="col-md-8 col-lg-5 col-xl-4" data-aos="zoom-in">
        <!-- Agency Branding -->
        <div class="text-center mb-4">
            <a href="/" class="navbar-brand-custom justify-content-center mb-2 fs-2">
                <i class="bi bi-globe-americas"></i>
                <span>EARTHSCAPE</span>
            </a>
            <p class="text-muted small">Monitoring Earth, Predicting Tomorrow</p>
        </div>

        <!-- Reset Password Card -->
        <div class="glass-card p-4 shadow-lg border border-secondary-subtle">
            <h4 class="fw-bold text-white mb-3 text-center">Define New Password</h4>
            
            <form action="/login" method="GET" onsubmit="alert('Password updated successfully. Please sign in with your new credentials.');">
                <div class="mb-3">
                    <label for="token" class="form-label form-label-custom">Verification Token</label>
                    <input type="text" id="token" class="form-control form-control-glass text-center letter-spacing-wide" placeholder="ES-984-ABC" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label form-label-custom">New Password</label>
                    <input type="password" id="password" class="form-control form-control-glass" placeholder="••••••••" required>
                </div>
                <div class="mb-4">
                    <label for="confirm" class="form-label form-label-custom">Confirm Password</label>
                    <input type="password" id="confirm" class="form-control form-control-glass" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-glass-success w-100 py-2 fs-6 mb-3">Update Credentials</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
