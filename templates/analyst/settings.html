{% extends 'layouts/base.html' %}

{% block title %}My Settings | Earthscape Climate Agency{% endblock %}

{% block breadcrumbs %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb mb-4">
        <li class="breadcrumb-item"><a href="/" class="text-accent-blue text-decoration-none">Home</a></li>
        <li class="breadcrumb-item"><a href="/analyst/dashboard" class="text-accent-blue text-decoration-none">Analyst Dashboard</a></li>
        <li class="breadcrumb-item active text-white" aria-current="page">Analyst Settings</li>
    </ol>
</nav>
{% endblock %}

{% block content %}
<div class="row justify-content-center" data-aos="fade-up">
    <div class="col-lg-8">
        <div class="glass-card p-5">
            <h3 class="text-white mb-4"><i class="bi bi-gear-wide-connected me-2 text-accent-blue"></i>Analyst Configurations</h3>
            
            <form action="/analyst/dashboard" method="GET" onsubmit="alert('Analyst preferences saved.');">
                <div class="mb-3">
                    <label class="form-label form-label-custom">Default Mapping Coordinate Grid</label>
                    <select class="form-control form-control-glass">
                        <option>Global view (Centroid 20, 0)</option>
                        <option>Arctic Polar Sector A</option>
                        <option>Amazon Basin Deforestation Zone</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label form-label-custom">Default Forecasting Horizon</label>
                    <select class="form-control form-control-glass">
                        <option>50 Years (2076 Horizon)</option>
                        <option>25 Years (2051 Horizon)</option>
                        <option>10 Years (Short range)</option>
                    </select>
                </div>
                <div class="mb-4">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="autosave" checked>
                        <label class="form-check-label text-secondary small" for="autosave">Automatically save model output drafts to File Manager</label>
                    </div>
                </div>
                <button type="submit" class="btn btn-glass-success w-100">Save Configuration</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
